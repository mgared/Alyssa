# Free Supabase projects pause after 7 days without activity. This makes a
# tiny read from the database every 3 days so the project stays awake, even
# before the site has visitors.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL  the Project URL, e.g. https://xxxx.supabase.co
#   SUPABASE_KEY  the publishable (anon) key, the same one the website uses
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read from the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_KEY secret is not set, so nothing was pinged."
            exit 0
          fi
          : > response.txt
          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 60 \
            -H "apikey: $SUPABASE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/site_content?select=key&limit=1") || status=000
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            head -c 500 response.txt 2>/dev/null; echo
            echo "::error::Supabase did not answer normally. The project may be paused: open it in the Supabase dashboard and restore it."
            exit 1
          fi
